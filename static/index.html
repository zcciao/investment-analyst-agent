<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Investment Analyst — PoC</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel-2: #1f2630;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --tool: #d2a8ff;
    --border: #30363d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  header button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  header button:hover { background: #2a313c; }
  #build-thesis-btn {
    background: var(--accent); color: #0b0e14; border-color: var(--accent);
    font-weight: 600;
  }
  #build-thesis-btn:hover { background: #79b8ff; }
  .wiz-input { width:100%; background:var(--panel-2); color:var(--text);
               border:1px solid var(--border); border-radius:8px;
               padding:8px 10px; font:inherit; margin-bottom:12px; box-sizing:border-box; }
  .wiz-label { font-size:12px; color:var(--muted); margin-bottom:4px; display:block; }
  .wiz-row { display:flex; gap:12px; }
  .wiz-row .wiz-col { flex:1; }
  .step-item { display:flex; align-items:center; gap:10px; padding:10px 0;
               border-bottom:1px solid var(--border); color:var(--muted); font-size:14px; }
  .step-item.active { color:var(--text); }
  .step-item.done { color:#3fb950; }
  .step-icon { width:18px; text-align:center; flex-shrink:0; }
  .step-spinner { width:14px; height:14px; border:2px solid var(--border);
                  border-top-color:var(--accent); border-radius:50%;
                  animation:spin 0.8s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .pillar-card { background:var(--panel); border:1px solid var(--border);
                 border-radius:8px; padding:12px; margin-bottom:10px; }
  .pillar-card .wiz-label { font-size:11px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
           background:#3fb950; color:#0e1117; border-radius:8px; padding:10px 20px;
           font-weight:600; z-index:300; animation:fadeout 3s forwards; pointer-events:none; }
  @keyframes fadeout { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  .wiz-section-label { font-size:14px; color:var(--text); font-weight:600;
                       margin:16px 0 8px; border-bottom:1px solid var(--border); padding-bottom:6px; }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 880px;
    width: 100%; margin: 0 auto;
  }
  .msg { margin: 14px 0; }
  .role { font-size: 11px; color: var(--muted); text-transform: uppercase;
          letter-spacing: 0.06em; margin-bottom: 4px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--panel-2); }
  .msg.assistant .bubble { }
  .tool {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; color: var(--tool);
    background: #1a1320; border: 1px solid #3a2a4a;
    border-radius: 8px; padding: 8px 10px; margin: 6px 0;
  }
  .tool .label { color: var(--muted); margin-right: 6px; }
  .tool details summary { cursor: pointer; }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-wrap: break-word;
              color: #c9d1d9; }

  form {
    display: flex; gap: 8px; padding: 14px 20px;
    border-top: 1px solid var(--border); background: var(--panel);
    max-width: 880px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 200px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button[type=submit] {
    background: var(--accent); color: #0b0e14; border: 0;
    border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer;
  }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .examples { padding: 0 20px 12px; max-width: 880px; margin: 0 auto;
              color: var(--muted); font-size: 13px; }
  .examples a { color: var(--accent); cursor: pointer; margin-right: 12px;
                text-decoration: none; }
  .examples a:hover { text-decoration: underline; }

  /* ---- Nav tabs ---- */
  .nav-tabs { display:flex; gap:0; border-bottom:1px solid var(--border);
              background:var(--panel); padding:0 20px; }
  .nav-tab  { padding:10px 18px; font-size:13px; font-weight:500; cursor:pointer;
              color:var(--muted); border:none; background:none;
              border-bottom:2px solid transparent; margin-bottom:-1px; }
  .nav-tab.active { color:var(--text); border-bottom-color:var(--accent); }
  .nav-tab:hover:not(.active) { color:var(--text); }

  /* ---- Dashboard ---- */
  #dashboard { display:none; flex:1; overflow-y:auto; padding:24px 20px; }
  .dash-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
               gap:16px; max-width:1100px; margin:0 auto; }
  .thesis-card { background:var(--panel); border:1px solid var(--border);
                 border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .thesis-card:hover { border-color:#444c56; }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-ticker { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
  .card-direction { font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px;
                    text-transform:uppercase; letter-spacing:0.05em; }
  .card-direction.long  { background:#12261e; color:#3fb950; border:1px solid #238636; }
  .card-direction.short { background:#2d1315; color:#f85149; border:1px solid #da3633; }
  .card-oneliner { font-size:13px; color:var(--muted); line-height:1.45; }
  .perf-row { display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .perf-current { font-size:20px; font-weight:700; }
  .perf-gain { font-size:13px; font-weight:600; padding:2px 7px; border-radius:5px; }
  .perf-gain.pos { background:#12261e; color:#3fb950; }
  .perf-gain.neg { background:#2d1315; color:#f85149; }
  .perf-entry { font-size:12px; color:var(--muted); }
  .pillars-row { display:flex; gap:6px; flex-wrap:wrap; }
  .pillar-dot { font-size:11px; padding:3px 8px; border-radius:4px; font-weight:500; }
  .pillar-dot.intact   { background:#12261e; color:#3fb950; border:1px solid #238636; }
  .pillar-dot.wobbling { background:#271d0e; color:#e3b341; border:1px solid #9e6a03; }
  .pillar-dot.broken   { background:#2d1315; color:#f85149; border:1px solid #da3633; }
  .conviction-row { display:flex; align-items:center; gap:8px; }
  .conviction-track { flex:1; height:5px; background:var(--panel-2);
                      border-radius:3px; overflow:hidden; }
  .conviction-fill  { height:100%; background:var(--accent); border-radius:3px; }
  .conviction-label { font-size:11px; color:var(--muted); white-space:nowrap; }
  .card-footer { display:flex; justify-content:space-between; align-items:center;
                 font-size:11px; color:var(--muted); padding-top:6px;
                 border-top:1px solid var(--border); }
  .card-footer a { color:var(--accent); cursor:pointer; text-decoration:none; font-size:11px; }
  .card-footer a:hover { text-decoration:underline; }
  .dash-empty { text-align:center; color:var(--muted); padding:60px 20px; }
  .dash-empty p { margin:8px 0; }
  #dash-refresh, #dash-run-watcher {
                  background:var(--panel-2); color:var(--text); border:1px solid var(--border);
                  border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12px; }
  #dash-run-watcher.running { opacity:0.6; cursor:not-allowed; }

  /* ---- Alerts panel ---- */
  .alerts-panel { margin-bottom:20px; }
  .alerts-header { display:flex; justify-content:space-between; align-items:center;
                   margin-bottom:10px; }
  .alerts-header h3 { margin:0; font-size:13px; font-weight:600; color:var(--text); }
  .alerts-dismiss-all { font-size:12px; color:var(--muted); cursor:pointer;
                        background:none; border:none; padding:0; }
  .alerts-dismiss-all:hover { color:var(--text); }
  .alert-card { background:var(--panel); border-radius:10px; padding:14px 16px;
                margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
  .alert-card.wobbling { border-left:3px solid #e3b341; }
  .alert-card.broken   { border-left:3px solid #f85149; }
  .alert-card.intact   { border-left:3px solid #3fb950; }
  .alert-icon  { font-size:18px; flex-shrink:0; margin-top:1px; }
  .alert-body  { flex:1; }
  .alert-meta  { font-size:12px; color:var(--muted); margin-top:4px; }
  .alert-title { font-size:13px; font-weight:600; }
  .alert-title .ticker { color:var(--accent); }
  .alert-transition { display:inline-flex; align-items:center; gap:4px;
                      font-size:11px; font-weight:600; margin-left:8px; }
  .alert-reasoning { font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5; }
  .alert-dismiss { background:none; border:none; color:var(--muted); cursor:pointer;
                   font-size:16px; padding:0 4px; flex-shrink:0; }
  .alert-dismiss:hover { color:var(--text); }
</style>
</head>
<body>

<header>
  <h1>Investment Analyst</h1>
  <span class="sub" id="model-info">PoC · LangGraph · …</span>
  <div style="margin-left:auto; display:flex; gap:8px;">
    <button id="build-thesis-btn">+ Build Thesis</button>
    <button id="reset" title="Start a new conversation">New thread</button>
  </div>
</header>

<div id="wizard-overlay" style="display:none; position:fixed; inset:0;
     background:rgba(14,17,23,0.97); z-index:100; overflow-y:auto; padding:24px 20px;">
  <div style="max-width:680px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0; font-size:18px;" id="wizard-title">Build Investment Thesis</h2>
      <button id="wizard-close" style="background:none; border:1px solid var(--border);
              color:var(--muted); border-radius:6px; padding:5px 12px; cursor:pointer;">✕ Close</button>
    </div>
    <div id="wizard-body"></div>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" id="tab-chat">Chat</button>
  <button class="nav-tab" id="tab-dashboard">Dashboard <span id="alert-badge" style="display:none;background:#e3b341;color:#0e1117;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;"></span></button>
</div>

<div id="chat"></div>

<div class="examples" id="chat-examples">
  Try:
  <a data-q="What positions am I tracking?">What positions am I tracking?</a>
  <a data-q="What's up with GOOG?">What's up with GOOG?</a>
  <a data-q="Give me a fundamentals snapshot of MSFT">Fundamentals: MSFT</a>
</div>

<form id="form">
  <textarea id="input" placeholder="Ask about a ticker or your theses…" autofocus></textarea>
  <button type="submit" id="send">Send</button>
</form>

<div id="dashboard">
  <div style="max-width:1100px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0; font-size:16px; font-weight:600;">Thesis Portfolio</h2>
      <div style="display:flex; gap:8px;">
        <button id="dash-run-watcher" title="Run watcher now">⟳ Run Watcher</button>
        <button id="dash-refresh">↻ Refresh</button>
      </div>
    </div>
    <div id="alerts-panel"></div>
    <div class="dash-grid" id="dash-grid"></div>
  </div>
</div>

<script>
  // ---------- model info ----------
  fetch("/health").then(r => r.json()).then(info => {
    const label = info.provider === "gemini" ? "Gemini" : "Claude";
    document.getElementById("model-info").textContent =
      `PoC · LangGraph · ${label} (${info.model})`;
  }).catch(() => {});

  // ---------- session / thread management ----------
  const THREAD_KEY = "ia.thread_id";
  function newThreadId() { return crypto.randomUUID(); }
  function getThreadId() {
    let id = localStorage.getItem(THREAD_KEY);
    if (!id) { id = newThreadId(); localStorage.setItem(THREAD_KEY, id); }
    return id;
  }

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const resetBtn = document.getElementById("reset");

  // ---------- rendering ----------
  function addMessage(role) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    wrap.innerHTML = `<div class="role">${role}</div><div class="bubble"></div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap.querySelector(".bubble");
  }
  function addTool(name, payload, kind) {
    const wrap = document.createElement("div");
    wrap.className = "tool";
    const label = kind === "call" ? "→ tool call" : "← tool result";
    wrap.innerHTML = `
      <details ${kind === "call" ? "open" : ""}>
        <summary><span class="label">${label}</span><b>${name}</b></summary>
        <pre>${escapeHtml(typeof payload === "string" ? payload : JSON.stringify(payload, null, 2))}</pre>
      </details>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ---------- send loop ----------
  // We use fetch() with a streaming reader rather than EventSource because
  // EventSource only does GET; our endpoint is POST so it can take a body.
  async function sendMessage(text) {
    const userBubble = addMessage("user");
    userBubble.textContent = text;

    const asstBubble = addMessage("assistant");
    asstBubble.textContent = "";

    sendBtn.disabled = true;
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({thread_id: getThreadId(), message: text}),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({detail: res.statusText}));
        asstBubble.textContent = "Error: " + (err.detail || res.statusText);
        return;
      }
      await readSSE(res, (event, data) => {
        if (event === "token") asstBubble.textContent += data.text;
        else if (event === "tool_call") addTool(data.name, data.args, "call");
        else if (event === "tool_result") addTool(data.name, data.result, "result");
        else if (event === "error") asstBubble.textContent += "\n[error] " + data.message;
        chat.scrollTop = chat.scrollHeight;
      });
    } catch (e) {
      asstBubble.textContent += "\n[network error] " + e.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function readSSE(res, onEvent) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      // SSE messages are separated by a blank line.
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const ev = parseSSE(raw);
        if (ev) onEvent(ev.event, ev.data);
      }
    }
  }
  function parseSSE(raw) {
    let event = "message", data = "";
    for (const line of raw.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data += line.slice(5).trim();
    }
    if (!data) return null;
    try { return {event, data: JSON.parse(data)}; }
    catch { return {event, data: {raw: data}}; }
  }

  // ---------- wiring ----------
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendMessage(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  document.querySelectorAll(".examples a").forEach(a => {
    a.addEventListener("click", () => { input.value = a.dataset.q; form.requestSubmit(); });
  });
  resetBtn.addEventListener("click", () => {
    localStorage.setItem(THREAD_KEY, newThreadId());
    chat.innerHTML = "";
  });

  // =========================================================================
  // Tab navigation
  // =========================================================================

  const tabChat      = document.getElementById("tab-chat");
  const tabDashboard = document.getElementById("tab-dashboard");
  const chatEl       = document.getElementById("chat");
  const chatExamples = document.getElementById("chat-examples");
  const formEl       = document.getElementById("form");
  const dashEl       = document.getElementById("dashboard");

  function showTab(name) {
    const isChat = name === "chat";
    tabChat.classList.toggle("active", isChat);
    tabDashboard.classList.toggle("active", !isChat);
    chatEl.style.display      = isChat ? "" : "none";
    chatExamples.style.display = isChat ? "" : "none";
    formEl.style.display      = isChat ? "" : "none";
    dashEl.style.display      = isChat ? "none" : "block";
    if (!isChat) loadDashboard();
  }

  tabChat.addEventListener("click",      () => showTab("chat"));
  tabDashboard.addEventListener("click", () => showTab("dashboard"));
  document.getElementById("dash-refresh").addEventListener("click", loadDashboard);

  document.getElementById("dash-run-watcher").addEventListener("click", async () => {
    const btn = document.getElementById("dash-run-watcher");
    btn.textContent = "⟳ Running…"; btn.classList.add("running"); btn.disabled = true;
    try {
      const res = await fetch("/watcher/run", {method: "POST"});
      const data = await res.json();
      showToast(`Watcher complete — ${data.new_alerts} new alert${data.new_alerts !== 1 ? "s" : ""}`);
      await loadDashboard();
    } catch (e) {
      showToast("Watcher failed: " + e.message);
    } finally {
      btn.textContent = "⟳ Run Watcher"; btn.classList.remove("running"); btn.disabled = false;
    }
  });

  // Poll for unread alert count every 60s (catches scheduled runs)
  async function refreshAlertBadge() {
    try {
      const res = await fetch("/watcher/alerts/count");
      const {unread} = await res.json();
      const badge = document.getElementById("alert-badge");
      if (unread > 0) { badge.textContent = unread; badge.style.display = "inline"; }
      else { badge.style.display = "none"; }
    } catch {}
  }
  refreshAlertBadge();
  setInterval(refreshAlertBadge, 60_000);

  // =========================================================================
  // Dashboard
  // =========================================================================

  async function loadDashboard() {
    const grid = document.getElementById("dash-grid");
    grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px 0;">Loading…</div>`;
    try {
      const [dashRes, alertsRes] = await Promise.all([
        fetch("/thesis/dashboard"),
        fetch("/watcher/alerts?unread_only=true"),
      ]);
      if (!dashRes.ok) throw new Error(dashRes.statusText);
      const [items, alerts] = await Promise.all([dashRes.json(), alertsRes.json()]);
      renderAlerts(alerts);
      renderDashboard(items);
      refreshAlertBadge();
    } catch (e) {
      grid.innerHTML = `<div class="dash-empty"><p>Failed to load: ${escapeHtml(e.message)}</p></div>`;
    }
  }

  function renderAlerts(alerts) {
    const panel = document.getElementById("alerts-panel");
    if (!alerts.length) { panel.innerHTML = ""; return; }

    const STATUS_ICON = {wobbling: "⚠️", broken: "🔴", intact: "✅"};
    const STATUS_COLOR = {wobbling: "#e3b341", broken: "#f85149", intact: "#3fb950"};

    const cards = alerts.map(a => {
      const icon = STATUS_ICON[a.new_status] || "⚠️";
      const color = STATUS_COLOR[a.new_status] || "#e3b341";
      const oldBadge = `<span style="color:${STATUS_COLOR[a.old_status]||"var(--muted)"}">${a.old_status}</span>`;
      const newBadge = `<span style="color:${color};font-weight:700">${a.new_status}</span>`;
      const date = new Date(a.created_at).toLocaleDateString("en-US", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
      return `
        <div class="alert-card ${a.new_status}" data-id="${a.id}">
          <div class="alert-icon">${icon}</div>
          <div class="alert-body">
            <div class="alert-title">
              <span class="ticker">${escapeHtml(a.ticker)}</span>
              — ${escapeHtml(a.pillar_name)}
              <span class="alert-transition">${oldBadge} → ${newBadge}</span>
            </div>
            <div class="alert-reasoning">${escapeHtml(a.reasoning)}</div>
            <div class="alert-meta">${date} · confidence ${a.confidence}/10</div>
          </div>
          <button class="alert-dismiss" data-id="${a.id}" title="Dismiss">×</button>
        </div>`;
    }).join("");

    panel.innerHTML = `
      <div class="alerts-panel">
        <div class="alerts-header">
          <h3>⚡ Watcher Alerts (${alerts.length} unread)</h3>
          <button class="alerts-dismiss-all" id="dismiss-all-btn">Dismiss all</button>
        </div>
        ${cards}
      </div>`;

    panel.querySelectorAll(".alert-dismiss").forEach(btn => {
      btn.addEventListener("click", async () => {
        await fetch("/watcher/alerts/read", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ids: [btn.dataset.id]}),
        });
        btn.closest(".alert-card").remove();
        const remaining = panel.querySelectorAll(".alert-card").length;
        if (!remaining) panel.innerHTML = "";
        refreshAlertBadge();
      });
    });

    document.getElementById("dismiss-all-btn")?.addEventListener("click", async () => {
      await fetch("/watcher/alerts/read", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ids: null}),
      });
      panel.innerHTML = "";
      refreshAlertBadge();
    });
  }

  function renderDashboard(items) {
    const grid = document.getElementById("dash-grid");
    if (!items.length) {
      grid.innerHTML = `<div class="dash-empty">
        <p style="font-size:32px">📋</p>
        <p>No theses yet.</p>
        <p>Click <strong>+ Build Thesis</strong> to create your first one.</p>
      </div>`;
      return;
    }
    grid.innerHTML = items.map(renderCard).join("");
    // Wire up "Ask analyst" links
    grid.querySelectorAll("[data-ask]").forEach(el => {
      el.addEventListener("click", () => {
        showTab("chat");
        document.getElementById("input").value = el.dataset.ask;
        document.getElementById("form").requestSubmit();
      });
    });
  }

  function renderCard({thesis, quote, performance}) {
    const t  = thesis;
    const q  = quote || {};
    const p  = performance;

    // Pillar status dots
    const pillarDots = (t.pillars || []).map(pl =>
      `<span class="pillar-dot ${pl.status}" title="${escapeHtml(pl.name)}">${escapeHtml(pl.name)}</span>`
    ).join("");

    // Performance block
    let perfHtml = "";
    if (p) {
      const sign    = p.gain_abs >= 0 ? "+" : "";
      const cls     = p.gain_abs >= 0 ? "pos" : "neg";
      const arrow   = p.gain_abs >= 0 ? "▲" : "▼";
      perfHtml = `
        <div class="perf-row">
          <span class="perf-current">$${fmt(p.current_price)}</span>
          <span class="perf-gain ${cls}">${arrow} ${sign}${fmt(p.gain_abs)} (${sign}${p.gain_pct}%)</span>
        </div>
        <div class="perf-entry">Entry ${t.entry_date ? `${t.entry_date} · ` : ""}$${fmt(p.entry_price)}</div>`;
    } else if (q.last_price) {
      perfHtml = `<div class="perf-row"><span class="perf-current">$${fmt(q.last_price)}</span></div>`;
    }

    // Day change badge
    const dayChange = q.day_change_pct != null
      ? `<span style="font-size:11px;color:${q.day_change_pct>=0?"#3fb950":"#f85149"}">
           ${q.day_change_pct>=0?"+":""}${q.day_change_pct?.toFixed(2)}% today
         </span>`
      : "";

    // Conviction bar
    const pct = ((t.conviction - 1) / 9 * 100).toFixed(0);
    const convHtml = `
      <div class="conviction-row">
        <span class="conviction-label">Conviction</span>
        <div class="conviction-track"><div class="conviction-fill" style="width:${pct}%"></div></div>
        <span class="conviction-label">${t.conviction}/10</span>
      </div>`;

    // Upcoming catalyst
    const nextCat = (t.catalysts || [])
      .filter(c => c.expected_date)
      .sort((a, b) => a.expected_date.localeCompare(b.expected_date))[0];
    const catHtml = nextCat
      ? `<span title="Next catalyst"">📅 ${escapeHtml(nextCat.name)} · ${nextCat.expected_date}</span>`
      : "";

    return `
      <div class="thesis-card">
        <div class="card-top">
          <div>
            <div class="card-ticker">${escapeHtml(t.ticker)}</div>
            <div class="card-oneliner">${escapeHtml(t.one_liner)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span class="card-direction ${t.direction}">${t.direction}</span>
            ${dayChange}
          </div>
        </div>
        ${perfHtml ? `<div>${perfHtml}</div>` : ""}
        ${convHtml}
        ${pillarDots ? `<div class="pillars-row">${pillarDots}</div>` : ""}
        <div class="card-footer">
          <span>${catHtml}</span>
          <a data-ask="What's up with ${escapeHtml(t.ticker)}?">Ask analyst →</a>
        </div>
      </div>`;
  }

  function fmt(n) {
    if (n == null) return "—";
    return Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // =========================================================================
  // Thesis Wizard
  // =========================================================================

  const wizardOverlay = document.getElementById("wizard-overlay");
  const wizardTitle   = document.getElementById("wizard-title");
  const wizardBody    = document.getElementById("wizard-body");

  document.getElementById("build-thesis-btn").addEventListener("click", showWizardForm);
  document.getElementById("wizard-close").addEventListener("click", closeWizard);

  function closeWizard() { wizardOverlay.style.display = "none"; }

  // ---- State A: Input form ----
  function showWizardForm() {
    wizardTitle.textContent = "Build Investment Thesis";
    wizardBody.innerHTML = `
      <div class="wiz-row">
        <div class="wiz-col">
          <label class="wiz-label">Ticker</label>
          <input class="wiz-input" id="wiz-ticker" placeholder="MU"
                 style="text-transform:uppercase" maxlength="10">
        </div>
        <div class="wiz-col">
          <label class="wiz-label">Purchase Price (USD)</label>
          <input class="wiz-input" id="wiz-price" type="number" step="0.01"
                 placeholder="389.00">
        </div>
      </div>
      <label class="wiz-label">Your thesis notes (raw reasoning is fine)</label>
      <textarea class="wiz-input" id="wiz-notes" rows="6"
        placeholder="e.g. Memory chips in high demand from AI boom. PE was still reasonable despite prior price hike. Strong HBM position for next-gen GPUs..."></textarea>
      <button id="wiz-submit" style="background:var(--accent);color:#0b0e14;border:0;
        border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer;width:100%;font-size:14px;">
        Analyze &amp; Build →
      </button>`;
    wizardOverlay.style.display = "block";
    document.getElementById("wiz-submit").addEventListener("click", startWizardBuild);
    document.getElementById("wiz-ticker").focus();
  }

  // ---- State B: Progress steps ----
  const STEP_LABELS = {
    draft:    "Drafting thesis skeleton",
    research: "Fetching live market data",
    refine:   "Refining with research",
    done:     "Finalizing & validating",
  };
  const STEP_ORDER = ["draft", "research", "refine", "done"];

  async function startWizardBuild() {
    const ticker = (document.getElementById("wiz-ticker").value || "").trim().toUpperCase();
    const price  = parseFloat(document.getElementById("wiz-price").value);
    const notes  = (document.getElementById("wiz-notes").value || "").trim();
    if (!ticker || !price || !notes) {
      alert("Please fill in all three fields."); return;
    }

    wizardTitle.textContent = `Building thesis for ${ticker}…`;
    wizardBody.innerHTML =
      STEP_ORDER.map(s => `
        <div class="step-item" id="step-${s}">
          <span class="step-icon" id="icon-${s}">○</span>
          <span>${STEP_LABELS[s]}</span>
        </div>`).join("") +
      `<div id="wiz-log" style="color:var(--muted);font-size:12px;margin-top:14px;min-height:32px;"></div>`;

    let finalThesis = null;
    let fetchError  = null;

    try {
      const res = await fetch("/thesis/build", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ticker, purchase_price: price, current_note: notes}),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({detail: res.statusText}));
        throw new Error(err.detail || res.statusText);
      }

      await readSSE(res, (event, data) => {
        const log = document.getElementById("wiz-log");
        if (event === "step_start") {
          const s = data.step;
          const el = document.getElementById(`step-${s}`);
          if (el) { el.classList.add("active"); }
          const ic = document.getElementById(`icon-${s}`);
          if (ic) { ic.innerHTML = `<span class="step-spinner"></span>`; }
        } else if (event === "step_done") {
          const s = data.step;
          const el = document.getElementById(`step-${s}`);
          if (el) { el.classList.remove("active"); el.classList.add("done"); }
          const ic = document.getElementById(`icon-${s}`);
          if (ic) { ic.innerHTML = "✓"; ic.style.color = "#3fb950"; }
          if (s === "research" && data.data?.price)
            log.textContent = `Live price: $${Number(data.data.price).toFixed(2)}` +
              (data.data.has_web ? " · Web search: ✓" : "");
          if (s === "draft" && data.data?.pillar_count)
            log.textContent = `Identified ${data.data.pillar_count} thesis pillars`;
          if (s === "refine" && data.data != null)
            log.textContent = `Filled ${data.data.pillars_filled}/${data.data.total} pillars with live data`;
        } else if (event === "thesis_ready") {
          finalThesis = data.thesis;
        } else if (event === "error") {
          fetchError = data.message;
          if (log) log.innerHTML = `<span style="color:#f85149">Error: ${escapeHtml(data.message)}</span>`;
        } else if (event === "done") {
          if (!fetchError && finalThesis) renderThesisReviewForm(finalThesis);
        }
      });
    } catch (e) {
      wizardBody.innerHTML += `<p style="color:#f85149;margin-top:12px">Network error: ${escapeHtml(e.message)}</p>`;
    }
  }

  // ---- State C: Editable review form ----
  function renderThesisReviewForm(thesis) {
    wizardTitle.textContent = `Review Thesis: ${thesis.ticker}`;
    const ep = thesis.exit_plan || {};

    let html = `
      <label class="wiz-label">One-liner</label>
      <input class="wiz-input" id="tf-one_liner" value="${ea(thesis.one_liner)}">
      <div class="wiz-row">
        <div class="wiz-col">
          <label class="wiz-label">Direction</label>
          <select class="wiz-input" id="tf-direction">
            <option ${thesis.direction==="long"?"selected":""}>long</option>
            <option ${thesis.direction==="short"?"selected":""}>short</option>
          </select>
        </div>
        <div class="wiz-col">
          <label class="wiz-label">Conviction (1–10)</label>
          <input class="wiz-input" id="tf-conviction" type="number" min="1" max="10"
                 value="${thesis.conviction}">
        </div>
        <div class="wiz-col">
          <label class="wiz-label">Time Horizon</label>
          <input class="wiz-input" id="tf-time_horizon" value="${ea(thesis.time_horizon)}">
        </div>
      </div>
      <div class="wiz-section-label">Pillars</div>`;

    (thesis.pillars || []).forEach((p, i) => {
      html += `
      <div class="pillar-card">
        <label class="wiz-label">Name</label>
        <input class="wiz-input" id="pillar-${i}-name" value="${ea(p.name)}">
        <label class="wiz-label">Current Value</label>
        <input class="wiz-input" id="pillar-${i}-current_value" value="${ea(p.current_value)}">
        <label class="wiz-label">Threshold Break</label>
        <input class="wiz-input" id="pillar-${i}-threshold_break" value="${ea(p.threshold_break)}">
        <label class="wiz-label">Watch Signals (comma-separated)</label>
        <input class="wiz-input" id="pillar-${i}-watch_signals"
               value="${ea((p.watch_signals||[]).join(", "))}">
      </div>`;
    });

    html += `
      <div class="wiz-section-label">Exit Plan</div>
      <label class="wiz-label">Take Profit</label>
      <input class="wiz-input" id="tf-take_profit" value="${ea(ep.take_profit||"")}">
      <label class="wiz-label">Thesis Break Condition</label>
      <input class="wiz-input" id="tf-thesis_break" value="${ea(ep.thesis_break||"")}">
      <label class="wiz-label">Time Stop</label>
      <input class="wiz-input" id="tf-time_stop" value="${ea(ep.time_stop||"")}">
      <div style="display:flex; gap:12px; margin-top:20px; padding-bottom:40px;">
        <button id="wiz-back" style="background:var(--panel-2);color:var(--text);
          border:1px solid var(--border);border-radius:8px;padding:10px 20px;cursor:pointer;">
          ← Back
        </button>
        <button id="wiz-save" style="flex:1;background:#3fb950;color:#0e1117;border:0;
          border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer;font-size:14px;">
          Save Thesis ✓
        </button>
      </div>`;

    wizardBody.innerHTML = html;
    wizardBody.dataset.pillarCount = (thesis.pillars || []).length;
    wizardBody.dataset.ticker = thesis.ticker;

    document.getElementById("wiz-back").addEventListener("click", showWizardForm);
    document.getElementById("wiz-save").addEventListener("click", () => saveThesis(thesis));
  }

  async function saveThesis(originalThesis) {
    const count = parseInt(wizardBody.dataset.pillarCount, 10);
    const pillars = [];
    for (let i = 0; i < count; i++) {
      pillars.push({
        name:            document.getElementById(`pillar-${i}-name`).value,
        current_value:   document.getElementById(`pillar-${i}-current_value`).value,
        threshold_break: document.getElementById(`pillar-${i}-threshold_break`).value,
        watch_signals:   document.getElementById(`pillar-${i}-watch_signals`).value
                           .split(",").map(s => s.trim()).filter(Boolean),
        status: "intact",
      });
    }
    const thesis = {
      ...originalThesis,
      ticker:       wizardBody.dataset.ticker,
      one_liner:    document.getElementById("tf-one_liner").value,
      direction:    document.getElementById("tf-direction").value,
      conviction:   parseInt(document.getElementById("tf-conviction").value, 10),
      time_horizon: document.getElementById("tf-time_horizon").value,
      pillars,
      exit_plan: {
        take_profit:  document.getElementById("tf-take_profit").value || null,
        thesis_break: document.getElementById("tf-thesis_break").value || null,
        time_stop:    document.getElementById("tf-time_stop").value || null,
      },
      last_updated: new Date().toISOString(),
    };

    const btn = document.getElementById("wiz-save");
    btn.disabled = true; btn.textContent = "Saving…";

    try {
      const res = await fetch("/thesis/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({thesis}),
      });
      const data = await res.json();
      if (data.ok) {
        closeWizard();
        showToast(`Thesis for ${data.ticker} saved ✓`);
        // If dashboard is visible, refresh it
        if (dashEl.style.display !== "none") loadDashboard();
      } else {
        throw new Error(data.detail || "Unknown error");
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = "Save Thesis ✓";
      alert("Save failed: " + e.message);
    }
  }

  // ---- Helpers ----
  function ea(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }
  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }
</script>
</body>
</html>
